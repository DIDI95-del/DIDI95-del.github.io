<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小迪様辛苦啦💦</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:14px;
  background:#f4f4f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#111827;
}
h1{font-size:24px;margin:10px 0 16px}
h2{font-size:18px;margin:0 0 12px}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}
label{font-size:14px;color:#555;display:block;margin-top:8px}
input,button,textarea{
  width:100%;
  min-height:50px;
  padding:0 14px;
  margin:6px 0 12px;
  border-radius:12px;
  border:1px solid #d4d4d8;
  font-size:16px;
  background:#fff;
  color:#111;
}
input[type="date"]{
  appearance:auto;
  -webkit-appearance:auto;
  height:50px;
  line-height:50px;
}
button{
  background:#111827;
  color:#fff;
  font-weight:bold;
  border:0;
}
button.gray{background:#6b7280}
button.red{background:#dc2626}
button.green{background:#16a34a}
.big{font-size:28px;font-weight:800}
.mid{font-size:20px;font-weight:700}
.greenText{color:#16a34a}
.redText{color:#e11d48}
.small{font-size:13px;color:#666;line-height:1.5}
.bar{
  height:18px;
  background:#ddd;
  border-radius:99px;
  overflow:hidden;
}
.fill{
  height:100%;
  background:#16a34a;
  width:0%;
}
.record{
  border-top:1px solid #eee;
  padding:10px 0;
}
textarea{
  height:150px;
  padding:10px;
  font-size:13px;
}
</style>
</head>

<body>

<h1>🚕 小迪様辛苦啦💦</h1>

<div class="card">
<h2>录入收入</h2>

<label>日期</label>
<input type="date" id="date">

<label>打表 / GO / Uber Taxi（円）</label>
<input type="number" id="meter" placeholder="0">

<label>Uber Premium（円）</label>
<input type="number" id="premium" placeholder="0">

<label>DiDi Van（円）</label>
<input type="number" id="van" placeholder="0">

<label>DiDi ライドシェア（円）</label>
<input type="number" id="ride" placeholder="0">

<button onclick="saveRecord()">保存 / 更新</button>
<button class="gray" onclick="clearInputs()">金额清零</button>

<div class="small">
切换日期时：有记录会自动读取，没有记录会自动清零，防止误操作。
</div>
</div>

<div class="card">
<h2>今日</h2>
<div>今日营业额</div>
<div class="big" id="todayGross">0円</div>
<div>今日预计到手</div>
<div class="big greenText" id="todayTake">0円</div>
</div>

<div class="card">
<h2>工资周期</h2>
<div class="mid" id="periodText">-</div>
<div class="small" id="paydayText">-</div>
</div>

<div class="card">
<h2>🔥 本期冲刺提醒</h2>
<div>本期公司营业额</div>
<div class="big" id="periodGross">0円</div>
<p id="progressText"></p>
<div class="bar"><div class="fill" id="progressBar"></div></div>
<h3 id="rateText"></h3>
<p class="redText" id="motivation"></p>
</div>

<div class="card">
<h2>工资估算</h2>

<div>公司步合基数</div>
<div class="big" id="baseAmount">0円</div>

<div>公司预计工资</div>
<div class="big greenText" id="companySalary">0円</div>

<br>

<div>DiDi RideShare 到手</div>
<div class="big greenText" id="rideSalary">0円</div>
<div class="small">RideShare：先去消费税，再拿75%。不参与步合。</div>

<br>

<div>预计25号到账</div>
<div class="big greenText" id="totalSalary">0円</div>
</div>

<div class="card">
<h2>统计</h2>
<div>本期出车天数：<b id="workDays">0天</b></div>
<div>日均公司营业额：<b id="avgGross">0円</b></div>
</div>

<div class="card">
<h2>数据备份 / 恢复</h2>

<button class="green" onclick="exportJSON()">导出备份JSON</button>

<label>粘贴备份JSON</label>
<textarea id="jsonBox" placeholder="把备份JSON粘贴到这里"></textarea>

<button class="gray" onclick="importJSON()">恢复备份</button>

<div class="small">
换手机/iPad时：旧设备导出JSON → 新设备粘贴 → 恢复。
</div>
</div>

<div class="card">
<h2>历史记录</h2>
<div id="records"></div>
</div>

<script>
const KEY="taxi_income_records_v1";

function yen(n){
  return Math.round(Number(n)||0).toLocaleString()+"円";
}

function todayStr(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function parseDate(str){
  const [y,m,d]=str.split("-").map(Number);
  return new Date(y,m-1,d);
}

function dateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function load(){
  return JSON.parse(localStorage.getItem(KEY)||"[]");
}

function save(data){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function num(id){
  return Number(document.getElementById(id).value||0);
}

function clearInputs(){
  document.getElementById("meter").value="";
  document.getElementById("premium").value="";
  document.getElementById("van").value="";
  document.getElementById("ride").value="";
  render();
}

function loadDateRecord(){
  const date=document.getElementById("date").value;
  const r=load().find(x=>x.date===date);

  if(r){
    document.getElementById("meter").value=r.meter||"";
    document.getElementById("premium").value=r.premium||"";
    document.getElementById("van").value=r.van||"";
    document.getElementById("ride").value=r.ride||"";
  }else{
    document.getElementById("meter").value="";
    document.getElementById("premium").value="";
    document.getElementById("van").value="";
    document.getElementById("ride").value="";
  }

  render();
}

function saveRecord(){
  const date=document.getElementById("date").value;

  if(!date){
    alert("请选择日期");
    return;
  }

  let data=load().filter(r=>r.date!==date);

  data.push({
    date,
    meter:num("meter"),
    premium:num("premium"),
    van:num("van"),
    ride:num("ride")
  });

  data.sort((a,b)=>a.date.localeCompare(b.date));
  save(data);

  alert("保存好了");
  render();
}

function getPayMonth(date){
  const d=parseDate(date);
  let y=d.getFullYear();
  let m=d.getMonth()+1;

  if(d.getDate()>=16){
    m++;
    if(m===13){
      m=1;
      y++;
    }
  }

  return {year:y,month:m};
}

function getPeriod(date){
  const pm=getPayMonth(date);

  const start=new Date(pm.year,pm.month-2,16);
  const end=new Date(pm.year,pm.month-1,15);
  const payday=new Date(pm.year,pm.month-1,25);

  return {
    start:dateStr(start),
    end:dateStr(end),
    payday:dateStr(payday),
    label:`${pm.year}年${pm.month}月工资：${start.getMonth()+1}/${start.getDate()}～${end.getMonth()+1}/${end.getDate()}`
  };
}

function inPeriod(r,p){
  return r.date>=p.start && r.date<=p.end;
}

function companyGross(r){
  return (r.meter||0)+(r.premium||0)+(r.van||0);
}

function companyBase(r){
  const normal=((r.meter||0)+(r.van||0))*0.98/1.1;
  const premium=(r.premium||0)*0.8/1.1;
  return normal+premium;
}

function rideTake(r){
  return ((r.ride||0)/1.1)*0.75;
}

function getRate(gross){
  if(gross<450000)return 0.45;
  if(gross<500000)return 0.53;
  if(gross<550000)return 0.56;
  if(gross<650000)return 0.60;
  if(gross<800000)return 0.63;
  return 0.68;
}

function nextTarget(gross){
  if(gross<450000)return {target:450000,rate:0.53,name:"53%档"};
  if(gross<500000)return {target:500000,rate:0.56,name:"56%档"};
  if(gross<550000)return {target:550000,rate:0.60,name:"60%档"};
  if(gross<650000)return {target:650000,rate:0.63,name:"63%档"};
  if(gross<800000)return {target:800000,rate:0.68,name:"68%档"};
  return null;
}

function render(){
  const date=document.getElementById("date").value||todayStr();
  const period=getPeriod(date);
  const all=load();
  const rows=all.filter(r=>inPeriod(r,period));

  const todayRecord=all.find(r=>r.date===date)||{meter:0,premium:0,van:0,ride:0};

  const periodGross=rows.reduce((s,r)=>s+companyGross(r),0);
  const periodBase=rows.reduce((s,r)=>s+companyBase(r),0);
  const periodRide=rows.reduce((s,r)=>s+rideTake(r),0);
  const rate=getRate(periodGross);

  const companySalary=periodBase*rate;
  const totalSalary=companySalary+periodRide;

  const todayGross=companyGross(todayRecord)+(todayRecord.ride||0);
  const todayTake=companyBase(todayRecord)*rate+rideTake(todayRecord);

  document.getElementById("todayGross").innerText=yen(todayGross);
  document.getElementById("todayTake").innerText=yen(todayTake);

  document.getElementById("periodText").innerText=period.label;
  document.getElementById("paydayText").innerText=`发薪日：${period.payday}`;

  document.getElementById("periodGross").innerText=yen(periodGross);
  document.getElementById("baseAmount").innerText=yen(periodBase);
  document.getElementById("companySalary").innerText=yen(companySalary);
  document.getElementById("rideSalary").innerText=yen(periodRide);
  document.getElementById("totalSalary").innerText=yen(totalSalary);

  document.getElementById("rateText").innerText=`当前步合：${Math.round(rate*100)}%`;

  const workDays=rows.filter(r=>companyGross(r)+(r.ride||0)>0).length;
  document.getElementById("workDays").innerText=workDays+"天";
  document.getElementById("avgGross").innerText=yen(workDays?periodGross/workDays:0);

  const next=nextTarget(periodGross);

  if(next){
    const lack=next.target-periodGross;
    const percent=Math.min(100,periodGross/next.target*100);

    const now=new Date();
    const end=parseDate(period.end);
    const left=Math.max(1,Math.ceil((end-now)/(1000*60*60*24))+1);
    const perDay=lack/left;
    const bonus=periodBase*(next.rate-rate);

    document.getElementById("progressBar").style.width=percent+"%";
    document.getElementById("progressText").innerText=
      `${yen(periodGross)} / ${yen(next.target)}　完成率 ${Math.round(percent)}%`;

    document.getElementById("motivation").innerHTML=
      `距离 ${next.name} 还差 <b>${yen(lack)}</b><br>`+
      `剩余 ${left} 天，平均每天还需要 <b>${yen(perDay)}</b><br>`+
      `冲上去预计多拿 <b>${yen(bonus)}</b><br>`+
      `小迪様，今天再冲一波就更接近啦💦`;
  }else{
    document.getElementById("progressBar").style.width="100%";
    document.getElementById("progressText").innerText="已进入最高冲刺区间";
    document.getElementById("motivation").innerText=
      "🏆 80万以上按68%，每多跑一点都很香。";
  }

  const box=document.getElementById("records");
  box.innerHTML="";

  rows.sort((a,b)=>b.date.localeCompare(a.date)).forEach(r=>{
    box.innerHTML+=`
      <div class="record">
        <b>${r.date}</b><br>
        打表 / GO / Uber Taxi：${yen(r.meter||0)}<br>
        Uber Premium：${yen(r.premium||0)}<br>
        DiDi Van：${yen(r.van||0)}<br>
        DiDi RideShare：${yen(r.ride||0)}<br>
        <button onclick="editRecord('${r.date}')">修改</button>
        <button class="red" onclick="deleteRecord('${r.date}')">删除</button>
      </div>
    `;
  });

  if(rows.length===0){
    box.innerHTML="<div class='small'>本期还没有记录。</div>";
  }
}

function editRecord(date){
  document.getElementById("date").value=date;
  loadDateRecord();
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteRecord(date){
  if(!confirm("删除这一天记录吗？"))return;

  const data=load().filter(r=>r.date!==date);
  save(data);

  loadDateRecord();
  render();
}

function exportJSON(){
  const text=JSON.stringify(load(),null,2);
  document.getElementById("jsonBox").value=text;

  if(navigator.clipboard){
    navigator.clipboard.writeText(text);
  }

  alert("备份JSON已生成。可以复制保存，或发到手机。");
}

function importJSON(){
  try{
    const text=document.getElementById("jsonBox").value.trim();
    const data=JSON.parse(text);

    if(!Array.isArray(data)){
      alert("格式不对，必须是JSON数组");
      return;
    }

    save(data);
    loadDateRecord();
    render();

    alert("恢复完成！");
  }catch(e){
    alert("JSON格式错误，恢复失败");
  }
}

document.addEventListener("DOMContentLoaded",function(){
  document.getElementById("date").value=todayStr();

  document.getElementById("date").addEventListener("change",function(){
    loadDateRecord();
  });

  ["meter","premium","van","ride"].forEach(id=>{
    document.getElementById(id).addEventListener("input",render);
  });

  loadDateRecord();
  render();
});
</script>

</body>
</html>
