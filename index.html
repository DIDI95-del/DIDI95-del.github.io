<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出租车收入仪表盘</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;padding:16px;color:#111}
.card{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 12px #0001}
h1{font-size:24px}
input,button,select{width:100%;padding:14px;margin:6px 0 12px;border-radius:12px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#111;color:white;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:bold}
.red{color:#e11d48}
.green{color:#16a34a}
.bar{height:18px;background:#ddd;border-radius:20px;overflow:hidden}
.fill{height:100%;background:#16a34a;width:0%}
.small{font-size:13px;color:#666}
.record{border-bottom:1px solid #eee;padding:8px 0}
</style>
</head>
<body>

<h1>🚕 出租车收入仪表盘</h1>

<div class="card">
<label>日期</label>
<input type="date" id="date">

<label>打表 / GO / Uber Taxi（円）</label>
<input type="number" id="meter">

<label>Uber Premium（円）</label>
<input type="number" id="premium">

<label>DiDi Van（円）</label>
<input type="number" id="van">

<label>DiDi ライドシェア（円）</label>
<input type="number" id="ride">

<button onclick="saveRecord()">保存今日收入</button>
</div>

<div class="card">
<h2>今日</h2>
<div>今日营业额</div>
<div class="big" id="todayGross">0円</div>
<div>今日预计到手</div>
<div class="big green" id="todayTake">0円</div>
</div>

<div class="card">
<h2>本月冲刺</h2>
<div>本月公司营业额</div>
<div class="big" id="monthGross">0円</div>

<p id="progressText"></p>
<div class="bar"><div class="fill" id="progressBar"></div></div>

<h3 id="rateText"></h3>
<p class="red" id="motivation"></p>
</div>

<div class="card">
<h2>工资估算</h2>
<div class="grid">
<div>
<div class="small">公司步合基数</div>
<div class="big" id="baseAmount">0円</div>
</div>
<div>
<div class="small">公司预计工资</div>
<div class="big" id="companySalary">0円</div>
</div>
</div>
</div>

<div class="card">
<h2>DiDi RideShare 单独统计</h2>
<div>本月 RideShare 营业额</div>
<div class="big" id="rideGross">0円</div>
<div>预计到手 73%</div>
<div class="big green" id="rideTake">0円</div>
</div>

<div class="card">
<h2>本月总预计收入</h2>
<div class="big green" id="totalSalary">0円</div>
</div>

<div class="card">
<h2>查询</h2>
<label>选择月份</label>
<input type="month" id="monthSelect" onchange="render()">
<button onclick="exportCSV()">导出CSV</button>
</div>

<div class="card">
<h2>历史记录</h2>
<div id="records"></div>
</div>

<script>
const KEY="taxi_income_records_v1";

document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("monthSelect").value=new Date().toISOString().slice(0,7);

function yen(n){return Math.round(n).toLocaleString()+"円";}
function num(id){return Number(document.getElementById(id).value||0);}

function load(){
  return JSON.parse(localStorage.getItem(KEY)||"[]");
}

function save(data){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function saveRecord(){
  const date=document.getElementById("date").value;
  if(!date){alert("请选择日期");return;}

  let data=load();
  data=data.filter(r=>r.date!==date);

  data.push({
    date,
    meter:num("meter"),
    premium:num("premium"),
    van:num("van"),
    ride:num("ride")
  });

  save(data);
  render();
  alert("保存好了！");
}

function companyGross(r){
  return r.meter+r.premium+r.van;
}

function companyBase(r){
  const normal=(r.meter+r.van)*0.98/1.1;
  const premium=r.premium*0.8/1.1;
  return normal+premium;
}

function rideTake(r){
  return r.ride*0.73;
}

function getRate(gross){
  if(gross<450000)return 0.45;
  if(gross<500000)return 0.53;
  if(gross<550000)return 0.56;
  if(gross<650000)return 0.60;
  if(gross<800000)return 0.63;
  return 0.68;
}

function nextTarget(gross){
  if(gross<450000)return {target:450000,rate:0.53};
  if(gross<500000)return {target:500000,rate:0.56};
  if(gross<550000)return {target:550000,rate:0.60};
  if(gross<650000)return {target:650000,rate:0.63};
  if(gross<800000)return {target:800000,rate:0.68};
  return null;
}

function render(){
  const data=load().sort((a,b)=>b.date.localeCompare(a.date));
  const today=document.getElementById("date").value;
  const month=document.getElementById("monthSelect").value;

  const todayData=data.find(r=>r.date===today)||{meter:0,premium:0,van:0,ride:0};
  const monthData=data.filter(r=>r.date.startsWith(month));

  const todayGross=companyGross(todayData)+todayData.ride;
  const todayTake=companyBase(todayData)*getRate(companyGross(todayData))+rideTake(todayData);

  const monthCompanyGross=monthData.reduce((s,r)=>s+companyGross(r),0);
  const monthBase=monthData.reduce((s,r)=>s+companyBase(r),0);
  const monthRideGross=monthData.reduce((s,r)=>s+r.ride,0);
  const monthRideTake=monthData.reduce((s,r)=>s+rideTake(r),0);

  const rate=getRate(monthCompanyGross);
  const companySalary=monthBase*rate;
  const totalSalary=companySalary+monthRideTake;

  document.getElementById("todayGross").innerText=yen(todayGross);
  document.getElementById("todayTake").innerText=yen(todayTake);
  document.getElementById("monthGross").innerText=yen(monthCompanyGross);
  document.getElementById("baseAmount").innerText=yen(monthBase);
  document.getElementById("companySalary").innerText=yen(companySalary);
  document.getElementById("rideGross").innerText=yen(monthRideGross);
  document.getElementById("rideTake").innerText=yen(monthRideTake);
  document.getElementById("totalSalary").innerText=yen(totalSalary);
  document.getElementById("rateText").innerText="当前步合："+Math.round(rate*100)+"%";

  const next=nextTarget(monthCompanyGross);
  if(next){
    const lack=next.target-monthCompanyGross;
    const percent=Math.min(100,monthCompanyGross/next.target*100);
    document.getElementById("progressBar").style.width=percent+"%";
    document.getElementById("progressText").innerText=
      yen(monthCompanyGross)+" / "+yen(next.target)+"　完成率 "+Math.round(percent)+"%";

    const bonus=monthBase*(next.rate-rate);
    document.getElementById("motivation").innerHTML=
      "🔥 距离下一档还差 <b>"+yen(lack)+"</b><br>"+
      "冲上去后，预计本月多拿 <b>"+yen(bonus)+"</b><br>"+
      "今天早点收车？还是再冲一波？";
  }else{
    document.getElementById("progressBar").style.width="100%";
    document.getElementById("progressText").innerText="已经进入最高冲刺区间";
    document.getElementById("motivation").innerText="🏆 80万以上部分按68%，现在每多跑一点都很香。";
  }

  const box=document.getElementById("records");
  box.innerHTML="";
  monthData.forEach(r=>{
    box.innerHTML+=`
    <div class="record">
      <b>${r.date}</b><br>
      打表/GO/Uber Taxi：${yen(r.meter)}<br>
      Uber Premium：${yen(r.premium)}<br>
      DiDi Van：${yen(r.van)}<br>
      RideShare：${yen(r.ride)}<br>
      <button onclick="deleteRecord('${r.date}')">删除</button>
    </div>`;
  });
}

function deleteRecord(date){
  if(!confirm("删除这一天记录？"))return;
  save(load().filter(r=>r.date!==date));
  render();
}

function exportCSV(){
  const data=load();
  let csv="日期,打表GO UberTaxi,Uber Premium,DiDi Van,DiDi RideShare\n";
  data.forEach(r=>{
    csv+=`${r.date},${r.meter},${r.premium},${r.van},${r.ride}\n`;
  });
  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="taxi_income.csv";
  a.click();
}

render();
</script>

</body>
</html>
